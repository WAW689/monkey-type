<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>猴子打字机 · 生存还是毁灭</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="上海对外经贸大学 山狗">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%92%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#14161c; --panel:rgba(22,24,31,.88); --line:#2c303b; --fg:#e8e6e1; --dim:#9a9ca3;
          --good:#7bd389; --bad:#ef6f6c; --gold:#f2c14e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; }
  #hud { position:fixed; top:16px; left:16px; width:380px; background:var(--panel); border:1px solid var(--line);
         border-radius:10px; padding:14px 16px; backdrop-filter:blur(6px); }
  h1 { font-size:17px; margin:0 0 2px; letter-spacing:.5px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #about { background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:6px;
           padding:3px 8px; font:inherit; font-size:11px; letter-spacing:0; cursor:pointer; flex:none; }
  #about:hover { color:var(--fg); border-color:var(--gold); }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1 1 auto; background:#232631; color:var(--fg); border:1px solid var(--line); border-radius:6px;
                 padding:6px 8px; font:inherit; font-size:12.5px; cursor:pointer; }
  .tabs button.on { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:600; }
  .train { display:flex; gap:8px; align-items:center; margin:0 0 10px; }
  .train button { background:#232631; color:var(--fg); border:1px solid var(--line); border-radius:6px;
                  padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; flex:none; }
  .train button:disabled { opacity:.55; cursor:wait; }
  #trainmsg { font-size:11px; color:var(--dim); line-height:1.35; }
  .desc { font-size:12.5px; line-height:1.6; color:#c9c8c3; min-height:60px; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; font-size:12.5px; color:var(--dim); margin:4px 0; }
  .row b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  .typed { font-size:22px; letter-spacing:3px; margin:8px 0 2px; min-height:32px; white-space:nowrap; }
  .typed .ok { color:var(--good); } .typed .no { color:#6d6f77; }
  .target { font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:8px; }
  canvas#chart { width:100%; height:90px; display:block; margin:8px 0; background:#1b1d24; border-radius:6px; }
  .ctrl { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); margin-top:6px; }
  .ctrl button { background:#232631; color:var(--fg); border:1px solid var(--line); border-radius:6px;
                 padding:5px 10px; font:inherit; cursor:pointer; }
  .ctrl button.on { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:600; }
  #sound:not(.on) { animation:soundPulse 2.4s ease-in-out infinite; }
  @keyframes soundPulse {
    0%, 100% { box-shadow:0 0 0 0 rgba(242,193,78,0); }
    50% { box-shadow:0 0 0 3px rgba(242,193,78,.2); }
  }
  .ctrl input[type=range] { flex:1; accent-color:var(--gold); }
  #mood { position:fixed; top:16px; right:16px; font-size:14px; padding:8px 14px; border-radius:8px;
          background:var(--panel); border:1px solid var(--line); transition:color .2s; }
  #view { position:fixed; right:16px; bottom:16px; display:flex; gap:6px; background:var(--panel);
          border:1px solid var(--line); border-radius:10px; padding:6px; backdrop-filter:blur(6px); }
  #view button { background:#232631; color:var(--fg); border:1px solid var(--line); border-radius:6px;
                 padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  #view button.on { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:600; }
  #hint { position:fixed; right:16px; bottom:68px; font-size:11px; color:var(--dim); letter-spacing:.3px;
          background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  #watermark { position:fixed; left:18px; bottom:14px; z-index:90; pointer-events:none; user-select:none;
               display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.14em;
               color:rgba(232,230,225,.34); text-shadow:0 1px 10px rgba(0,0,0,.75); }
  #watermark::before { content:''; width:18px; height:1px; background:rgba(242,193,78,.45); }
  #watermark b { font-weight:600; color:rgba(242,193,78,.52); }
  @media (max-width:640px) {
    #watermark { left:12px; bottom:10px; font-size:10px; letter-spacing:.08em; }
  }
  #banner { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); font-size:26px; letter-spacing:4px;
            color:var(--gold); text-shadow:0 2px 12px rgba(0,0,0,.6); opacity:0; transition:opacity .4s; pointer-events:none; }
  #banner.show { opacity:1; }
  #intro { position:fixed; inset:0; z-index:80; display:block;
           background:
             linear-gradient(90deg, rgba(7,8,11,.92) 0%, rgba(7,8,11,.78) 26%, rgba(7,8,11,.42) 44%, rgba(7,8,11,0) 62%),
             radial-gradient(700px 520px at 18% 30%, rgba(0,0,0,.2), transparent 70%);
           opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s; pointer-events:none; }
  #intro.open { opacity:1; visibility:visible; pointer-events:auto; }
  .intro-box { position:absolute; left:4.5vw; top:7vh; width:min(620px,42vw); height:80vh;
               display:flex; flex-direction:column; padding:0; border:none; background:none;
               box-shadow:none; border-radius:0; overflow:visible; }
  .intro-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .intro-kicker { font-size:11px; letter-spacing:.26em; color:var(--gold); opacity:.85; text-shadow:0 2px 12px #000; }
  #introClose { background:transparent; border:1px solid rgba(232,230,225,.22); color:var(--dim); width:30px; height:30px;
                border-radius:50%; cursor:pointer; font:inherit; font-size:13px; line-height:1; flex:none; }
  #introClose:hover { color:var(--fg); border-color:var(--gold); }
  .intro-stage { flex:1; min-height:0; overflow:hidden; position:relative; margin:3vh 0 2vh; scrollbar-width:none;
                 -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 7%, #000 90%, transparent 100%);
                 mask-image:linear-gradient(to bottom, transparent 0, #000 7%, #000 90%, transparent 100%); }
  .intro-stage::-webkit-scrollbar { display:none; }
  .intro-lines { position:relative; padding:8vh 0 18vh; }
  .bg-line { position:relative; margin:0 0 26px; padding-left:20px;
             font-family:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
             font-size:clamp(16px,1.55vw,22px); line-height:1.9; color:#000; opacity:.5;
             transform:translateY(14px); filter:blur(5px);
             transition:color 1.1s ease, opacity 1.1s ease, transform 1.1s cubic-bezier(.22,.61,.36,1),
                        filter 1.1s ease, text-shadow 1.1s ease; }
  .bg-line::before { content:''; position:absolute; left:0; top:.55em; width:2px; height:1.05em; border-radius:2px;
                     background:var(--gold); opacity:0; transform:scaleY(.2); transform-origin:top;
                     transition:opacity .8s, transform .8s; }
  .bg-line.active { color:#f5f0e6; opacity:1; transform:none; filter:none; text-shadow:0 0 30px rgba(242,193,78,.2), 0 2px 10px #000; }
  .bg-line.active::before { opacity:.85; transform:scaleY(1); }
  .bg-line.past { color:#000; opacity:.5; transform:translateY(-8px); filter:blur(.4px); text-shadow:none; }
  .bg-line.past::before { opacity:0; }
  .bg-line.future { color:#000; opacity:0; transform:translateY(18px); filter:blur(8px); }
  .bg-line em { font-style:normal; color:var(--gold); transition:color 1.1s; }
  .bg-line.past em { color:inherit; }
  .intro-bottom { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:6px; }
  .intro-dots { display:flex; gap:6px; }
  .intro-dots span { width:5px; height:5px; border-radius:50%; background:#2a2e38; transition:background .5s, box-shadow .5s; }
  .intro-dots span.on { background:var(--gold); box-shadow:0 0 8px rgba(242,193,78,.7); }
  .intro-dots span.done { background:#0c0d12; }
  .intro-actions { display:flex; gap:8px; }
  .intro-actions button { background:rgba(35,38,49,.82); color:var(--fg); border:1px solid rgba(44,48,59,.95); border-radius:7px;
                          padding:7px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .intro-actions button.primary { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:600; }
  .intro-actions button:hover { border-color:var(--gold); }
  .intro-hint { text-align:left; font-size:11px; color:var(--dim); opacity:.65; margin-top:8px; letter-spacing:.08em; }
  body.intro-on #hud, body.intro-on #mood, body.intro-on #view, body.intro-on #hint { opacity:0; pointer-events:none; }
  body.intro-on #banner { opacity:0; }
  #hud, #mood, #view, #hint { transition:opacity .45s ease; }
  @media (max-width:900px) {
    .intro-box { left:5vw; width:min(72vw,620px); }
    .bg-line { font-size:17px; }
  }
  @media (max-width:640px) {
    .intro-box { left:5vw; width:90vw; height:82vh; }
    .intro-lines { padding:5vh 0 12vh; }
    .bg-line { font-size:16px; padding-left:16px; margin-bottom:22px; }
    .intro-hint { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #intro, .bg-line, .bg-line::before { transition-duration:.01s !important; }
  }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center;
         font-size:15px; line-height:1.8; padding:40px; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="watermark">上海对外经贸大学 <b>· 山狗</b></div>
<div id="hud">
  <h1><span>🐒 猴子打字机</span><button id="about" title="项目背景：无限猴子定理">📖 背景</button></h1>
  <div class="sub">目标：<span id="tgt"></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="train">
    <button id="train">🎲 实时训练</button>
    <span id="trainmsg">示例回放 · 点按钮用随机种子现场训练</span>
  </div>
  <div class="desc" id="desc"></div>
  <div class="typed" id="typed"></div>
  <div class="target" id="tline"></div>
  <div class="row"><span id="stepLabel">步</span><b id="step">0</b></div>
  <div class="row"><span>正确字数</span><b id="score">0 / 13</b></div>
  <div class="row" id="extraRow"><span id="extraLabel"></span><b id="extra"></b></div>
  <canvas id="chart"></canvas>
  <div class="ctrl">
    <button id="play">暂停</button>
    <span>速度</span><input id="speed" type="range" min="1" max="60" value="6"><span id="speedv"></span>
  </div>
  <div class="ctrl"><span>进度</span><input id="seek" type="range" min="0" max="1000" value="0"><button id="sound" title="音效开关">🔇 音效关</button></div>
  <div class="ctrl"><span>音量</span><input id="vol" type="range" min="0" max="100" value="30"><span id="volv">30</span></div>
</div>
<div id="mood">🙂 准备中</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div id="view">
  <button id="vLeft" title="向左旋转视角">⟲ 左转</button>
  <button id="vRight" title="向右旋转视角">右转 ⟳</button>
  <button id="vAuto" title="自动旋转视角">自动</button>
  <button id="vReset" title="回到默认视角">复位</button>
</div>
<div id="banner">生存还是毁灭，这是一个问题！</div>
<div id="intro" aria-hidden="true">
  <div class="intro-box" role="dialog" aria-modal="true" aria-label="项目背景：无限猴子定理">
    <div class="intro-top">
      <span class="intro-kicker">背景 · 无限猴子定理</span>
      <button id="introClose" title="关闭" aria-label="关闭背景介绍">✕</button>
    </div>
    <div class="intro-stage" id="introStage"><div class="intro-lines" id="introLines"></div></div>
    <div class="intro-bottom">
      <div class="intro-dots" id="introDots"></div>
      <div class="intro-actions">
        <button id="introReplay">重播</button>
        <button id="introDone" class="primary">进入演示 →</button>
      </div>
    </div>
    <div class="intro-hint" id="introHint">点击画面继续 · Esc 关闭</div>
  </div>
</div>
<div id="err"></div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
